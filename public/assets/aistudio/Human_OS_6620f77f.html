<title>Human OS</title>
<style>
:root{--bg:#f7f3ea;--sf:#fffdf8;--tx:#1f2421;--mu:#6b716c;--em:#0b5d48;--emd:#073d30;--go:#b08d3c;--ln:#e4ddcc;--ok:#0b5d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101513;--sf:#18201d;--tx:#ece8dc;--mu:#9aa39d;--em:#3fb391;--emd:#0b5d48;--go:#d1ad5a;--ln:#2a3530}}
:root[data-theme=dark]{--bg:#101513;--sf:#18201d;--tx:#ece8dc;--mu:#9aa39d;--em:#3fb391;--emd:#0b5d48;--go:#d1ad5a;--ln:#2a3530}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 "Inter","Segoe UI",system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:1.9rem}h2{font-size:1.25rem}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 110px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.hero{background:var(--emd);color:#f4efe0;border-radius:18px;padding:22px;margin-bottom:18px;background-image:radial-gradient(circle at 100% 0,rgba(176,141,60,.25) 0 90px,transparent 91px)}
.hero p{margin:.3em 0;opacity:.85}.hero .q{color:#e3c987;font-family:Georgia,serif;font-size:1.1rem;margin-top:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;min-width:0}
textarea{width:100%;min-height:90px}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 13px}
button.p{background:var(--em);color:#fff;border-color:var(--em)}
:root[data-theme=dark] button.p,:root:not([data-theme=light]) button.p{color:#06150f}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.pr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pr button{padding:12px 4px;text-align:center;line-height:1.2}
.pr button.on{background:var(--em);color:#fff;border-color:var(--em)}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}.done .t{text-decoration:line-through;color:var(--mu)}
.x{color:var(--mu);border:0;background:none;padding:4px 8px}
.mu{color:var(--mu);font-size:.9rem}
.bar{height:8px;border-radius:6px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--go)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
nav button{border:0;background:none;flex:1;min-width:64px;font-size:.82rem;color:var(--mu);padding:8px 4px}
nav button.on{color:var(--em);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.big{font-family:Georgia,serif;font-size:1.7rem}

<script>
const KEY="humanos.v1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
S=S||{};S.tasks=S.tasks||[];S.goals=S.goals||[];S.money=S.money||[];S.people=S.people||[];S.notes=S.notes||[];S.days=S.days||{};S.rem=S.rem||[];
let NQ={q:"",k:""},EX={},NL=10;
const NF=()=>[...S.notes].reverse().filter(n=>(!NQ.k||n.k===NQ.k)&&(!NQ.q||(n.t+n.b).toLowerCase().includes(NQ.q.toLowerCase())));
if(!S.seeded2){S.seeded2=1;["അസ്ഥിത്വത്തെ അനുഭവിച്ച് കൊണ്ട് പഠിക്കുക ,അനുഭവിക്കുക മാത്രമാകുമ്പോള്‍ അസ്ഥിത്വം അപൂര്‍ണമാകുന്നു.","ഞാന്‍ എ ചിന്ത മനുഷ്യമനസ്സില്‍ എപ്പോഴും കത്തിനില്ക്കു ഒരു വികാരമാണ് അത് കൂടുതല്‍ പ്രോല്‍സാഹിപ്പിക്കപെടുമ്പോള്‍ മനുഷ്യ കൂടുതല്‍ സന്തോഷിക്കുന്നു. അത് അപമാനിക്കപെടുമ്പോള്‍ അവന്‍ ദുഖത്തിന്റെ പടുകുഴിയിലേക്ക് ചാടുന്നു.ഇതിലെ ശിയായ നിലപാട്....","ആത്യന്തികമായ സത്യം മനസ്സിലാക്കണമെങ്കില്‍ ശുദ്ധമായ മനസ്സിന്റെ അകത്ത് നിന്നും അനുഭവിക്കണം,അവിടെ സത്യത്തിലേക്ക് നോകു വഴിക്ക് അഴി തെറ്റിക്കു ഒന്നും ഉണ്ടാകില്ല അതേസമയം വഴിതെറ്റിക്കു പ്രക്രിയ മനുഷ്യര്‍ക്കിടയിലുള്ള നൈസര്‍ഗികമായ പ്രക്രിയയാണെ് മനസ്സിലാക്കി അതിനെ ആസ്വദിക്കാനും കഴിയുക എതും ഒരു ജീവിത സൂത്രവാക്യമാണ്","മനുഷ്യന് അവന്റെ ജീവിതായുസ്സിനുള്ളില്‍ നിന്നും ഭൂമിയില്‍ ത െഒരു സ്വര്‍ഗ്ഗം പണിയാന്‍ കഴിയും ,സുഖ ഭോഗങ്ങളുടേതല്ലാത്ത,ത്യാഗങ്ങളുടേയും സഹനങ്ങളുടേയും കഠിന പ്രയത്‌നങ്ങളുടേയും എവിടെയും സ്‌നേഹം ഒഴുകു ഒരു നാട് മനുഷ്യമനസ്സ് ഐശ്വര്യത്താല്‍ നിറക്കാന്‍ കഴിയു ഭൂമിയിലെ സ്വര്‍ഗ്ഗം.മരണത്തിന് ശേഷം ജീവിതമുണ്ടോ ?(ഈ ചോദ്യം ത െആഗ്രഹങ്ങളുടേയും പ്രതീക്ഷകളുടേയും ഇരയായ മനുഷ്യന്റെ മനസല്ലെ?,അങ്ങനെ ഒരു ജീവിതത്തിന്റെ ആവിശ്യം ഉണ്ടോ?) എറിയാത്ത മനുഷ്യന്‍ അവനറിയു ജീവിതം നായി ജീവിച്ച് സ്വതന്ത്രമനസോടു കൂടി മരണത്തിന് കീഴടങ്ങുക, ശേഷം എന്ത് സംഭവിച്ചാലും നായി ജീവിച്ചവന് ഒന്നും ഭയപ്പെടാനില്ല. അവര്‍ എപ്പോഴും സ്വതന്ത്രരാണ് 'ദൈവത്തിന്റെ മുില്‍ പോലും'.","എന്തല്ലാം ആയിരുാലും എന്തല്ലാം സംഭവിച്ചാലും എന്റെ ജീവിതത്തോടുള്ള നിലപാട് തപ്തയാണ്.എനിക്ക് ഭൗതിമായ അനാവിശ്യതാല്പര്യങ്ങളൊന്നും ഇല്ല,മനുഷ്യന്‍ ജനിക്കുത് ത െഅബോധ മനസ്സിലാണ് ബോധനസ്സെത് അവന്‍ സ്വയം ഉണ്ടാക്കി എടുക്കേണ്ടതാണ്.","മറ്റു മനുഷ്യരുമായി എനിക്ക് ഒരേ ഒരു ബന്ധം മാത്രമേയുള്ളൂ-സൗഹൃദം,കൂടുതല്‍ അടുത്തവരുമായി അതിന്റെ ആഴം കൂടും.","മിതത്വം എ വാക്കിന് ജീവിതത്തില്‍ ഒരുപാട് സ്വാധീനമുണ്ട് പക്ഷെ അതിനെ പൂര്‍ണമായും മനസിലാക്കാന്‍ എനിക്ക് ഇതു വരെ സാധിച്ചി'ില്ല.","ചെയ്യു കര്‍മ്മങ്ങളും വാക്കുകളും എപ്പോഴും ആത്മാര്‍ത്ഥമാക്കുക.എപ്പോഴും ഒരു നല്ല ലക്ഷ്യം മുില്‍ കാണുക","ആധുനികവല്ക്കരണം അത് പ്രകൃതിയെ നശിപ്പിക്കുന്നു,നൈസര്‍ഗികമായി ശരീരത്തോട് അടുത്ത് നില്ക്കു മനിഷ്യനെ അസ്വസ്ഥനാക്കുന്നു.അനാവിശ്യ സുഖങ്ങ്ള്‍ക്ക് വേണ്ടി പ്രകൃതിയെ ഉപയോഗിക്കുവരാണ് കൂടുതല്‍ ദുഖം അനുഭവിക്കേണ്ടി വരിക.","നല്ല ഗാനങ്ങള്‍ ഒഴുകുത് ഹൃദയത്തില്‍ നിാണ്.","മനുഷ്യ മനസ്സിന്റെ ഗതി വിഗതികളെ നിശ്ചയിക്കു മൂ് തരം തലങ്ങളാണ് ഉള്ളത്.\n1.വര്‍ത്തമാന സഹചര്യം\n2.\n3.\nകല എാല്‍ മനുഷ്യമനസ്സിന്റെ നന്മ്യയുടെ ആവിശ്ക്കാരമാണ്,അത് ആത്മാര്‍ഥമാകുമ്പോള്‍ അസ്വാദകന്റെ മനസിന് കുളിര് നല്ക്കും ,അവന്റെ ഹൃദയത്തിലേക്ക് നന്മ വര്‍ഷിക്കും.","ദൈവത്തെ കണ്ടെത്താന്‍ മതങ്ങളോ മത ഗ്രന്ഥങ്ങളോ ആവിശ്യമില്ല, അതിന് തെളിഞ്ഞ മനസ് മാത്രം മതി. ഈ മതത്തില്‍ വിശ്വസ്സിച്ചാലെ സ്വര്‍ഗ്ഗം ലഭിക്കൂ എ് പറയു മതവും തെറ്റാണ്.എാല്‍ കാലഘ'ങ്ങളിലൂടെ കട് വ പല മതങ്ങളിലും സത്യത്തിന്റെ അംശങ്ങള്‍ കാണാം.","മതങ്ങള്‍ക്ക് ഇത്രയധികം ജനപിന്തുണയുണ്ടാകാന്‍ കാരണം,ജന്മനാ ഒന്നും അറിയാത്തവനായി ജനിക്കു മനുഷ്യന്‍ ജനി മൃതികളുടേയും അഭൗമമായ സൗര്യത്തിന്റേയും ഭയത്തിന്റെ ഭീകരഭാവങ്ങളും നിറഞ്ഞ ലോകത്ത് ഇതിനെയെല്ലാം ഏതങ്കിലും തരത്തില്‍ നിര്‍വചിക്കു മതങ്ങളില്‍ അഭയം പ്രാപിക്കുന്നു.സ്വന്തമായി സ്വത്വത്തെ കണ്ടെത്തുവര്‍ വളരെ ചുരുക്കമാണ്.അവര്‍ മാത്രമെ ദൈവത്തെ യഥാര്‍ത്തില്‍ ദൈവത്തെ കണ്ടെത്തൂ.","മനുഷ്യര്‍ തമ്മിലുള്ള പ്രശ്‌നങ്ങള്‍ തീരണമെങ്കില്‍ ഒരേ ഒരു പരിഹാരമേയുള്ളൂ ജീവിതയാത്ഥാര്‍ത്യങ്ങളില്‍ നിന്നും ഉണ്ടാക്കിയെടുത്ത സൗഹൃദമെ അനശ്വരമായ വികാരം, ഏത് തരം ബന്ധങ്ങളേയും ഈ വികാരം ആദരിക്കും.","മനസ്സിലാക്കിയ തത്വങ്ങള്‍ മറ് പോകുമോ എ ഭയം അലോസരമുണ്ടാക്കുന്നു.","നിര്‍വാണത്തിന്റെ ഉറവിടം ജീവിത യാഥാര്‍ത്ഥ്യങ്ങളില്‍ നിന്നും ആകണം.","മനുഷ്യന്റെ കൈയ്യും ബുദ്ധിയും അവന്റെ സ്വന്തം ഭക്ഷനത്തിന് വേണ്ടിയാണ് ആദ്യം ഉപയോഗിക്കേണ്ടത്. അവന്‍ സ്വയം പര്യാപ്തമായതിന്‍ ശേഷം തന്റെ ചുറ്റും ഉള്ളവരെ അവരുടെ ഭക്ഷണത്തിന് വേണ്ടി പര്യാപ്തമാക്കുതിന് സഹായിക്കുക.","മനുഷ്യന്റെ ശരീരത്തിന് ഈര്‍ച്ചവാളുകൊണ്ട് മുറിച്ച് രണ്ട് തുണ്ടാകുമ്പോള്‍ ഉണ്ടാകു വേദന സഹിയാക്കാനുള്ള കഴിവുണ്ടായിരിക്ക ത െരതിയുടെ ഉന്മാദത്തില്‍ ശരീര സുഖത്തിന്റെ അത്യുതങ്ങള്‍ അനുഭവിക്കാനുമുള്ള കഴിവുമുണ്ട്.അതായത് ഈ രണ്ടവസ്ഥകള്‍ക്കിടയിലുള്ള ഏതവസ്ഥയേയും മനുഷ്യന് അനുഭവിക്കനും അഭിനയിക്കാനും കഴിയും എത് വെക്തമായ യാത്ഥാര്‍ത്യമാണ്. മനുഷ്യമനസ്സിന് ജീവിതപ്രശ്‌നങ്ങളില്‍ പെ'് ഭ്രന്തമായ അവസ്ഥയെ പ്രാഭിക്കാമെിരിക്കെ എല്ലാ പ്രശ്‌നങ്ങളേയും തപ്തമായ ഹൃദയത്തില്‍ കണ്ട് ആത്മീയ സുഖത്തിന്റെ അനന്ദത്തില്‍ മുഴുകാനും,ബുദ്ധനെ പോലെ നിര്‍വാണം പ്രാഭിക്കാനും കഴിയും,അതായത് ഈ രണ്ടവസ്ഥകള്‍ക്കിടയിലുള്ള ഏതവസ്ഥയേയും മനുഷ്യന് അനുഭവിക്കനും അഭിനയിക്കാനും കഴിയും എതും വെക്തമായ യാത്ഥാര്‍ത്യമാണ്.ഇതിനിടയില്‍ നിന്നും നമ്മള്‍ ജീവിക്കു സാഹചര്യത്തിനനുസരിച്ച് ജീവിത സത്യത്തിലേക്ക് എത്താനും നമുക്ക് കഴിയണം.","മനസ്സ് ശുദ്ധമായ ഒരു പുഴപോലെ ഒഴുക്കു അവസ്ഥയിലല്ലാതെ ,മനസ്സില്‍ ഉടലെടുക്കു ചിന്തകളെ വിശ്വസിക്കുകയോ ഭയപെടുകയോ ബുദ്ധിമു'ുകയോ ചെയ്യേണ്ടതില്ല, And always try to get the pure flow.","ഈ ലോകത്തിന് ഇവിടെ ജനിക്കു ഓരോ മനുഷ്യന്റേയും കഴിവും സേവനവും ആവിശ്യമുണ്ട് എല്ലാവരുടേയും സ്‌നേഹം കൊണ്ട് നിറഞ്ഞാല്‍ ലോകം ത െമാറി പോകും.പക്ഷെ അതിന് എല്ലാവരും ആവിശ്യമില്ലാത്ത ചിന്തകള്‍ വെടിഞ്ഞ് സ്വന്തത്തെ കണ്ടെത്തണം,എനിട ജീവിതത്തിന്റെ ഓരോ നിമിഷവും ധന്യമായ കര്‍മ്മങ്ങളാല്‍ നിറക്കുക.","എന്റെ ജീവിത ലക്ഷ്യത്തിനായ് ഞാന്‍ എടുക്കു തീരുമാനങ്ങള്‍ നടപ്പിലാക്കാന്‍ എന്റെ നിയന്ത്രണത്തിനതീത മായ ശരീരം എതിര് നില്ക്കുമ്പോള്‍ ,ശരീരത്തിനെതിരെ കഴിയുത്ര പ്രതിരോധം തീര്‍ത്ത് മന്‍സ്സ്‌സിന്റെ വിജയം നേടുക.","മനുഷ്യന് അവന്റെ മനസ്സ് പൂര്‍ണ്ണമായും പങ്കുവെക്കുവാന്‍ കഴിയുത് ആദ്യമായി അവനോട് തയൊണ്. മറ്റുള്ളവര്‍ക്ക് അത് മനസ്സിലാക്കാന്‍ കഴിയണമെില്ല. അങ്ങനെ മറ്റൊരാളുണ്ടെങ്കില്‍ നമ്മുടെ പ്രതിബിംബം അയാളില്‍ കാണാം.അയാള്‍ നല്ലൊരു സുഹൃത്തുമായിരിക്കും.","മനുഷ്യന്‍ അവന്റെ ജീവിതത്തെ കുറിച്ച് പൂര്‍ണ്ണമായും അരിവില്ലാത്തവനാണ്,പി െഎങ്ങനെ അവന്‍ ഈ അറിയാത്ത ജീവിതത്തെ ജീവിക്കും,ഉത്തരം:സുഖവും ആഗ്രഹവും,ഇവയുടെ അര്‍ഥതലങ്ങള്‍ മനസ്സിലാക്കിയില്ലങ്കില്‍,ഇവ നമ്മുടെ ജീവിതത്തിന് നിഗൂഢമായ ഒരു വഴിയാവും കാണിച്ച് തരിക; മനുഷ്യന്‍ ജീവതത്തെ കുറിച്ച് ചിന്തിക്കുക ഈ രണ്ട് കാര്യങ്ങള്‍ക്ക് തടസം സംഭവിക്കുമ്പോഴാണ്. എങ്കില്‍ ഇത് അറിയു നിമിഷം ആത്മഹത്യയാണ് പോംവഴിയാക്കുതെങ്കില്‍;മനുഷ്യന്‍ എ ചിന്തിക്കു ജീവിയുടെ അസ്ഥിത്വത്തിന് അര്‍ത്ഥമില്ലാതായി പോകും; അതെ മനുഷ്യന്റെ മുിലുള്ള ചോദ്യം ഇത് ത െ''ജീവിതം?'';ഇതിനുത്തരം തേടുമ്പോള്‍ ജീവിതം മനുഷ്യന് മുില്‍ തപ്തമായി മാറും. പക്ഷെ ഞാന്‍ ഇതുവരെ ഉത്തരം കണ്ടെത്തിയി'ില്ല........?","സ്വസ്ഥമായ സാമൂഹികവും മനാസികവുമായ ജീവിതം നയിക്കു മനുഷ്യര്‍ ലോകത്ത് മറ്റു ഭഗങ്ങളില്‍ അസ്വസ്ഥമായ ജീവിതം നയിക്കുവര്‍ക്ക് സമാധാന പരമായി ജീവിക്കാന്‍ വേണ്ട കാര്യങ്ങള്‍ ചെയ്ത് കൊടുക്കുക എത് അവരുടെ വെക്തമായ കടമയാണ്.","വെക്തമായ ധാരണകളോട് കൂടി ജീവിക്കുക","പല സന്ദര്‍ഭങ്ങളില്‍ മാറികൊണ്ടിരിക്കു നമ്മുടെ മനസ്സിനനുസരിച്ചല്ല നാം നമ്മുടെ നല്ല മനസ്സില്‍ ചിന്തിച്ചെടുത്ത നിലപാടുകളെ സമീപികേണ്ടത്. ആ നിലപാടുകളെ അതിനേക്കാള്‍ നല്ല നിലപാടുകള്‍ തെളിഞ്ഞ മനസ്സില്‍ ഉടലെടുക്കുമ്പോള്‍ മാത്രമ്മെ പുനസ്ഥാപിക്കാവൂ.അതുവരെ ആ നിലപാടുകള്‍  മനപ്പൂര്‍വ്വമായി ത െജീവിതത്തിന്റെ ഓരോ നിമിഷവും പാലിക്കണം. മറ്റു അവസ്ഥകളേയും പ്രശ്‌നങ്ങളേയും വെക്തമായി നിരീക്ഷിച്ച് പഠിച്ച് പരിഹാരം കാണുക.","മനുഷ്യന് അവന്റെ പരിധിക്കുള്ളില്‍ നിന്നും ചമയാനോ അല്ലെങ്കില്‍ സ്വാഭാവികമയി വരുതോ ആയ നിശ്ചിതമായ കുറച്ച് ഭാവങ്ങളാണുള്ളത്. അതില്‍ ഏറ്റവും ഔിത്യമുള്ളതും നിഷ്‌കളങ്കമായതുമായ ഓണ് ബുദ്ധന്റേത് അത് ലോകത്തിന്റെ ദുഖം തന്റേതായി കണ്ടതും മനുഷ്യമനസ്സ് മാലാഖയുടേതായി മാറിയതുമായിരുന്നു.","മനുഷ്യന്‍ നൈസര്‍ഗികമായി എപ്പോഴും യഥാര്‍ത്ഥ്യത്തില്‍ നിന്നും അകലെയാണ്.","ജീവിക്കാനുള്ള ഊര്‍ജ്ജം നേടേണ്ടത് മറ്റുള്ളവരില്‍ നിന്നുള്ള അഭിനന്ദങ്ങളില്‍ നിാേ സാഹചര്യങ്ങളുടെ ആനുകൂല്യങ്ങളില്‍ നിാേ അല്ല,ആപേക്ഷിക സത്യങ്ങളില്‍ നിാേ അല്ല; അത് തെളിഞ്ഞ മനസ്സിന്റെ ആഴങ്ങളില്‍ നിന്നുള്ള നന്മയുടെ ചിന്തകളില്‍ നിന്നുള്ളതാകണം.","സമര്‍പ്പണം എ വാക്കിന്റെ അര്‍ഥം മനസ്സിലാകുില്ല.","ഞാന്‍ എന്റെ ഗ്രാമത്തെ ഇഷ്'പെടുത് അതിന്റെ മനസ്സിനെ തപ്തമാക്കി കളയു പ്രകൃതിയും ഹരിതാഭയും ലാളിത്യവും സ്‌നേഹമുള്ള കുറേ മനുഷ്യരുമുള്ളത് കൊണ്ടാണ്.","അംഗീകാരങ്ങള്‍ ലഭിക്കുമ്പോള്‍ അപമാനിതനാകുവന്റെ ഹൃദയം നുറുങ്ങു വേദന മറക്കരുത്; ഭക്ഷണം വയറു നിറയെ ലഭിക്കുമ്പോള്‍ ഒരു നേരം ഭക്ഷണം കഴിക്കാനില്ലാത്തവന്റെ അസഹ്യമായ വിശപ്പ് മറക്കരുത്.","പാശ്ചാത്യരുടെ സംസ്‌ക്കാരം ഭൗതികതയില്‍ കെ'ിപൊക്കിയതാണെ് നാം എത്ര വാദിച്ചാലും അവരുടെ മര്യാദയുടെ നാലയലത്ത് എത്തില്ല ആത്മനിഷ്ടാവാദികളായ നമ്മുടെ മര്യാദ.","മനസാനിധ്യത്തോടെ ജീവിതത്തിന്റെ ഓരോ നിമിഷവും ജീവിക്കാന്‍ സാധിക്കുക എത് അപൂര്‍വ്വമായ കഴിവാണ്,മനസ്സറിയാത്ത ഒന്നും അ കര്‍മ്മത്തില്‍ നിന്നും ഉണ്ടാകില്ല.","മനുഷ്യന്റെ ആത്മാന്വേഷണത്തിനും ബോധോദയത്തിനും പരിപൂര്‍ണ നിശബ്ദതയും പ്രകൃതിയുടെ ഹരിതാഭയും സ്വച്ചമായ വായുവും അനിവാര്യമാണ്.നഗരങ്ങള്‍ ഇവയെല്ലാം മനുഷ്യന് നിഷേധിക്കുന്നു.അവ ഭൗതിക താല്പര്യങ്ങളുടെ മുകളില്‍ കെ'ിപൊക്കിയവയാണ്.","നിശ്ബ്ദതയുടെ കാമുകനാണ് ഞാന്‍ ,എന്റെ മനസ് ശൂന്യത്യില്‍ വിഹരിക്കുകയാണ്,എന്റെ കര്‍മ്മങ്ങളുടെ ഉണര്‍വ്വെല്ലാം നിര്‍വ്വാണത്തില്‍ നിന്നുമാണ്.","എന്റെ മനസ്സിന്റെ ആഴങ്ങളില്‍ പതിഞ്ഞ് കിടക്കു ദുഖങ്ങളെ എനിക്ക് പറയാന്‍ കഴിയുില്ല ,അതിനുള്ള വാക്കുകള്‍ എനിക്കറിയുകയില്ല.","ജീവിതം നമ്മളോട് എത്രത െപ്രതികൂലമായിരുാലും നമ്മുടെ തിരിച്ചുള്ളാ സമീപനം എപ്പോഴും സ്വസ്ഥമായതും വൃത്തിയായതും ശുഭാപ്തി വിശ്വാസമുള്ളതുമാകണം.","എല്ലാവരും മറ്റുള്ളവരില്‍ നിന്നും പ്രതീക്ഷിക്കുത് അംഗീകാരങ്ങളും സ്‌നേഹവും നല്ല സാമീപ്യവുമാണ്;അത് അവരുടെ നമ്മോടൂള്ള പെരുമാറ്റം നോക്കിയാവരുത്.സ്‌നേഹം ലഭിക്കാതെ ആകുമ്പോഴാണ് മനുഷ്യരുടെ ഭാവം ദേഷ്യമാകുത്.","മനുഷ്യന് ഈ ജീവിതത്തില്‍ സ്വീകരിക്കാവു ഏറ്റവും നല്ല ആദര്‍ശം നിര്‍വാണം ആണ്. അത് മനുഷ്യ മനസില്‍ നിന്നും ജന്മവാസനകളെ കളയുന്നു. മനസില്‍ ആത്മീയ ചിന്തകളുടെ വസന്തകാലം സൃഷ്ടിക്കുന്നു.,മനസ്സ് ക്രിയാത്മക മാകുന്നു ,അസ്ഥിത്വത്തിന്റെ നിഗൂഢ രഹസ്യങ്ങളിലേക്ക് അകകണ്ണിന്റെ വെളിച്ച മെത്തുന്നു.","എന്റെ മനസ്സിന് മുമ്പില്‍ ഞാന്‍ എ വെക്തി വീണ്ടും വീണ്ടും തോറ്റ് കൊണ്ടിരിക്കുന്നു,മനസ്സിന്റെ ചിന്തകളോളം ഉയരാന്‍ എനിക്ക് കഴിയുില്ല, അഹങ്കാരവും ,കുശുമ്പും അസൂയയയും ജന്മവാസനകളും അനാവിശ്യ ഭയങ്ങളും ,ചിന്തകളും എന്റെ പ്രായോഗിക ജീവിതത്തെ മാനസിക ജീവിത വീക്ഷണങ്ങളുടെ മനോഹര ലോകത്ത് നിനും അര്‍ഥശൂന്യമായ ഒരു ലോകത്തേക്ക് തള്ളി വിടുന്നു.","ഭൗതിക സുഖങ്ങലക്ക് വേണ്ടി എത്ര ത്യാഗം സഹിക്കുവാനും തയ്യാറാവു നാം ആത്മീയതയുടെ കാര്യത്തില്‍ മടി കയറിവരു നിമിഷം അതിനെ ഉപേക്ഷിക്കന്‍ തയ്യാറാകുന്നു.","ഞാന്‍ ജീവിക്കു കാലഘ'ം എ െനോവിക്കുില്ല,എന്റെ പ്രകൃതി അതിന്റെ പരിപൂര്‍ണ്ണമായ അനുഗ്രഹമല്ലാതെ ദുരിതങ്ങളൊ'ും തി'ില്ല ,പ'ിണിയുടെ യഥാര്‍ത്ഥ മുഖം ഞാന്‍ കണ്ടി'ില്ല,അനാഥത്വത്തിന്റെ അര്‍ഥം എനിക്കറിയില്ല,വേദനയുടെ അഗാധദ ഞാന്‍ അനുഭവിച്ചി'ില്ല ; ഇങ്ങനെയൊക്കെ ആയിരുാലും ബുദ്ധനേയും റൂമിയേയും ഓഷോയേയും വായിച്ച് എനിക്ക് നെടുവീര്‍പ്പിടാം ,തപ്ത ഹൃദയത്തെ കുറിച്ച് അറിയാം ഇസ്സങ്ങളെ കുറിച്ച് പഠിക്കാം, ആദര്‍ശങ്ങളെ കുറിച്ച് ദീര്‍ഘ ചര്‍ച്ചകള്‍ നടത്താം ,ത്യാഗികളെ കുറിച്ചോര്‍ത്ത് കണീരൊഴുക്കാം, അതേ സമയം രതി സുഖം നേടാം ഭക്ഷണങ്ങളുടെ വൈവിധ്യങ്ങളായ രുചികളറിയാം ,എതങ്കിലും യാചകന് ആണ്ടിലൊരിക്കല്‍ എന്തങ്കിലും നല്കി മന്‍സ്സിനെ തൃപ്ത്തിപെടുത്താം ,സാങ്കേതികതയുടെ നൂതന വിദ്യകളുടെ ലോകത്ത് അഭിരമിക്കാം സിനിമകള്‍ കണ്ടും നോവലുകള്‍ വായിച്ചും ആസ്വദിക്കാം ലോകം കണാന്‍ യത്രകള്‍ നടത്താം ,ഇതു പോലുള്ള എഴുത്തുകുത്തുകളെഴുതി വെരുതെ ഇരിക്കാം, ഈ പ്രായത്തെ കുറിച്ചോര്‍ത്ത് കരയണോ ചിരിക്കണൊ എനെിക്ക് അറിഞ്ഞ് കൂടാ?","മനുഷ്യന്റെ മനസ്സും ശരീരവും തമ്മിലുള്ള ബന്ധം ആത്മാവിന്റെ അസ്ഥിത്വത്തെ ചൊദ്യം ചെയ്യുന്നു. ആത്മാവ് അനശ്വരമായ ഓയിരുങ്കെില്‍ ജന്മത്തിന് മുമ്പുള്ള അതിന്റെ അവസ്ഥ നമ്മുക്കരിയണമായിരുന്നു, ജനിച്ച സമയത്ത് നമുക്കറിയണമായിരുന്നു,ജീവിതത്തിന്റെ ഓരോ ഘ'ങ്ങളിലും ജീവിത രഹസ്യത്തെ കുറിച്ച് ചിന്തിക്കാന്‍ കഴിയണമായിരുന്നു. മനുഷ്യന്റെ വളര്‍ച്ചക്കനുസരിച്ച് വളരു ചിന്തയെ എങ്ങനെയാണ് അനശ്വരതയുമായി സമന്വയിപ്പിക്കുത്? ശരീരം നശിക്കുതോടെ മനസ്സും നശിക്കില്ലെ് പറയാന്‍ എന്ത് തെലിവിനെയാണ് നാം കൂ'്പിടിക്കുക.","ആകാശത്തിലേക്കും മണ്ണിലേക്കും നോക്കുമ്പോള്‍ മാത്രമെ മനസ്സിന് ആശ്വാസം കി'ുന്നുള്ളൂ ,ഇതിനിറ്റയില്‍ കാണുതെല്ലാം മനസിനെ അസ്വസ്ഥമാക്കുന്നു.","മനുഷ്യന്‍ പൂര്‍ണമായും സ്വാഭാവികതയില്‍ വിശ്വസിക്കുക ,കാരണം മനുഷ്യനെ സംബന്ധിച്ച് അവന്റെ ജന്മം ത െപൂര്‍ണ്ണമായും സഭാവികതയില്‍ നിാകുമ്പോള്‍ ശേഷിക്കുത് നമ്മുടെ ഇച്ഛപോലാകണമെത് അസംബന്ധമാണ്.","ബുദ്ധിമു'ുമ്പോള്‍ സ്വസ്ഥമാകണമെന്നും സ്വസ്ഥമാകുമ്പോള്‍ ബുദ്ധിമു'ണമെന്നും ചിന്തിക്കു മനസാണ് മനുഷ്യന്റേത്.","വിശന്നു വലയു സമയത്താണ് ശരീരം അതിന്റെ യഥാര്‍ത്ഥ വിനയഭാവം കാണിക്കുത്.ജീവിതത്തിന്റെ ചില യഥാത്ഥ്യങ്ങള്‍ മനസ്സിലേക്ക് കട് വരുതും ,മനസ് തപ്തമായി പോകുതും അപ്പോള്‍ ത.െ","എിലേക്ക് മാത്രം ഊിയിരിക്കു മനസാണ് എന്റേത് എിലേക്ക് നോകുത് പോലെ മറ്റുള്ളവരിലേക്ക് നോക്കാന്‍ അത് എപ്പോഴും മടിക്കുന്നു.","ചില നല്ല നിമിഷങ്ങള്‍ മനസ്സിനെ വല്ലാതെ ഉലച്ച് കളയുന്നു.ആവിശ്യമില്ലാത്ത ചിന്തകളേയും വൃത്തികെ' സ്വഭാവങ്ങളേയും പിഴുതെടുത്ത് കളയാന്‍ തോാറ് അപ്പോഴാണ്.","സൗന്ദര്യത്തിന് മനുഷ്യ ജീവിതത്തില്‍ വെക്തമായ സ്വാധീനമുണ്ട് പക്ഷെ അതിന്റെ പേരില്‍ സൗന്ദര്യം കുറഞ്ഞവര്‍ക്ക് ജീവിത വിഭവങ്ങള്‍ നിഷേധിക്കാന്‍ പാടില്ല.","എന്തെങ്കിലും തരത്തിലുള്ള സന്തോഷം കണ്ടെത്താതെ നമുക്ക് ഒന്നും നായി ചെയ്യന്‍ കഴിയില്ല.","ഗാന്ധിയുടെ രക്തം കൊണ്ടും മനുഷ്യത്വത്തിന്റെ സമ്പൂര്‍ണ്ണത കൊണ്ടും തങ്ങളുടെ രാജ്യത്തെ ജനതയോടുള്ള സ്‌നേഹം കൊണ്ടും മഹത്വങ്ങളായ മനുഷ്യരാല്‍ എഴുതപെ' ഇന്ത്യന്‍ ഭരണ ഘടന ജീവന്‍ കൊടുത്തും സംരക്ഷിക്കു എത് എന്റെ കടമയാണ്.","മനുഷ്യന്റെ മടിയന്‍ സ്വഭാവമാണ് യന്ത്രങ്ങളുടെ കണ്ടുപിടുത്തത്തിന് കാരണം.!!.!!there were no need of mechines in the agricultural economy in our ancestors' period","peace and happy are not same ,these are oppsite words.happy and sorrow are same words\nTo know the truth about our existence first of all we need an open mind,loveable mind"].forEach(b=>S.notes.push({id:Math.random().toString(36).slice(2,9),k:"Thought",t:"",b,d:new Date().toISOString().slice(0,10)}));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const day=()=>S.days[today()]=S.days[today()]||{prayers:{},reflect:{}};
const uid=()=>Math.random().toString(36).slice(2,9);
const PR=["Fajr","Dhuhr","Asr","Maghrib","Isha"];
const AREAS=["Spiritual","Health","Family","Career","Finance","Learning","Service","Legacy"];
const hijri=()=>{try{return new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(new Date())}catch(e){return""}};
const TABS=[["today","Today"],["goals","Goals"],["money","Money"],["people","People"],["library","Library"],["remind","Reminders"]];
function nav(){$("#nav").innerHTML=TABS.map(([k,v])=>`<button class="${tab===k?"on":""}" data-t="${k}">${v}</button>`).join("")}
$("#nav").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}};
function list(items,fmt,key){return items.length?items.map(i=>`<div class="item ${i.done?"done":""}">${fmt(i)}<button class="x" aria-label="Delete" data-del="${key}:${i.id}">✕</button></div>`).join(""):`<p class="mu">Nothing here yet. Add your first entry above.</p>`}
function render(){
 nav();const a=$("#app");
 if(!S.name){a.innerHTML=`<div class="hero"><h1>Human OS</h1><p>Live with purpose. Grow with wisdom. Leave with legacy.</p></div>
 <div class="card"><h2>Begin</h2><p class="mu">Everything stays on this device. All questions are optional except your name.</p>
 <div class="row"><input id="n" class="grow" placeholder="Your name" aria-label="Your name"></div><br>
 <div class="row"><input id="age" type="number" min="1" max="120" placeholder="Age (optional)" aria-label="Age"><select id="st" aria-label="Life stage"><option value="">Life stage (optional)</option><option>Student</option><option>Early career</option><option>Building a family</option><option>Raising children</option><option>Established</option><option>Elder / mentor</option></select></div><br>
 <label class="mu">What matters most to you right now?</label><textarea id="vals" placeholder="Faith, family, learning, health…"></textarea><br><br>
 <button class="p" id="go">Start</button></div>`;
  $("#go").onclick=()=>{const n=$("#n").value.trim();if(!n){$("#n").focus();return}S.name=n;S.age=$("#age").value;S.stage=$("#st").value;S.vals=$("#vals").value;save();render()};return}
 const d=day();
 const head=`<header><div><div class="mu">${new Date().toDateString()} · ${esc(hijri())}</div><h1>${{today:"Today",goals:"Goals",money:"Earn, spend, save, share",people:"Family & people",library:"Knowledge & writing",remind:"Reminders"}[tab]}</h1></div><button id="th" aria-label="Toggle theme">◐</button></header>`;
 let b="";
 if(tab==="today"){
  const open=S.tasks.filter(t=>!t.done).length,pd=PR.filter(p=>d.prayers[p]).length;
  const ds=[...Array(7)].map((_,i)=>{const x=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10);return{x,n:PR.filter(p=>(S.days[x]||{prayers:{}}).prayers[p]).length}});
  let streak=0;for(let i=6;i>=0;i--){if(ds[i].n===5)streak++;else if(i===6)continue;else break}
  const wk=ds.reduce((s,y)=>s+y.n,0),t0=today(),over=S.tasks.filter(t=>!t.done&&t.due&&t.due<t0),focus=S.tasks.filter(t=>!t.done).sort((x,y)=>["Top 3","Normal","Low"].indexOf(x.pr)-["Top 3","Normal","Low"].indexOf(y.pr)).slice(0,3),dn=S.tasks.filter(t=>t.done).length;
  const mo=new Date().toISOString().slice(0,7),mx=k=>S.money.filter(x=>x.d.startsWith(mo)&&x.k===k).reduce((s,x)=>s+x.v,0),inc=mx("Earn"),sp=mx("Spend"),sv=mx("Save"),sh=mx("Share");
  const gAvg=S.goals.length?Math.round(S.goals.reduce((s,g)=>s+g.p,0)/S.goals.length):0,noGoal=AREAS.filter(a=>!S.goals.some(g=>g.a===a)),refl=Object.values(d.reflect).some(v=>v);
  const neglect=[...over.map(t=>"Overdue: "+t.t),...S.people.filter(p=>(Date.now()-(p.last||0))/864e5>(+p.every||30)).map(p=>"Reach out to "+p.name+(p.rel?" ("+p.rel+")":"")),...(!sh&&S.money.length?["No giving recorded this month"]:[]),...(noGoal.length&&S.goals.length?["No goals in: "+noGoal.slice(0,3).join(", ")]:[]),...(!refl?["Evening reflection not started"]:[])];
  const words=S.notes.reduce((s,n)=>s+n.b.trim().split(/\s+/).filter(Boolean).length,0);
  const dash=`<div class="grid"><div class="card"><h2>Focus</h2>${focus.length?focus.map(t=>`<div class="item"><span class="grow">${t.pr==="Top 3"?"★ ":""}${esc(t.t)} <span class="mu">${t.due||""}</span></span></div>`).join(""):'<p class="mu">Add up to three tasks marked Top 3 to set today’s focus.</p>'}<div class="mu">${dn} done · ${open} open${over.length?" · "+over.length+" overdue":""}</div></div>
  <div class="card"><h2>Prayer this week</h2><div class="row" style="gap:6px">${ds.map(y=>`<div style="text-align:center"><div style="width:30px;height:30px;border-radius:8px;background:var(--em);opacity:${.15+y.n*.17}" title="${y.x}: ${y.n}/5"></div><div class="mu" style="font-size:.75rem">${new Date(y.x+"T12:00").toLocaleDateString("en",{weekday:"narrow"})}</div></div>`).join("")}</div><p class="mu">${wk}/35 prayers · ${streak}-day full streak</p></div>
  <div class="card"><h2>Money this month</h2><div class="mu">Earned ${inc.toLocaleString()} · Spent ${sp.toLocaleString()}</div><div class="mu">Saved ${sv.toLocaleString()} · Shared ${sh.toLocaleString()}</div><div class="bar" aria-hidden="true"><i style="width:${inc?Math.min(100,Math.round((sv+sh)/inc*100)):0}%"></i></div><p class="mu">${inc?Math.round(sp/inc*100)+"% of income spent":"Add income to see ratios"}</p></div>
  <div class="card"><h2>Goals</h2><div class="big">${gAvg}%</div><div class="bar" aria-hidden="true"><i style="width:${gAvg}%"></i></div><p class="mu">${S.goals.length} goals across ${AREAS.length-noGoal.length} of ${AREAS.length} life areas</p></div>
  <div class="card"><h2>You</h2><p class="mu">${S.age?"Age "+esc(S.age)+" · ":""}${esc(S.stage||"Life stage not set")}</p><p class="mu">${S.people.length} people tracked · ${S.notes.length} notes · ${words.toLocaleString()} words written</p></div>
  <div class="card"><h2>Needs attention</h2>${neglect.length?neglect.slice(0,5).map(n=>`<div class="item"><span class="grow">${esc(n)}</span></div>`).join(""):'<p class="mu">Nothing neglected. Well done.</p>'}</div></div>`;
  const stale=S.people.filter(p=>(Date.now()-(p.last||0))/864e5>(+p.every||30)).map(p=>p.name);
  b=`<div class="hero"><p>Salaam, ${esc(S.name)}.</p><h2>What matters most today?</h2><p>${pd}/5 prayers · ${open} open tasks${stale.length?` · reach out to ${esc(stale.slice(0,2).join(", "))}`:""}</p><p class="q">“Indeed, with hardship comes ease.” <span class="mu" style="color:#cdbf98">Quran 94:6</span></p></div>${dash}
  <div class="card"><h2>Prayers</h2><div class="pr">${PR.map(p=>`<button class="${d.prayers[p]?"on":""}" data-p="${p}">${p}<br>${d.prayers[p]?"✓":"–"}</button>`).join("")}</div></div>
  <div class="card"><h2>Tasks</h2><div class="row"><input id="tt" class="grow" placeholder="Add a task" aria-label="Task"><select id="tp" aria-label="Priority"><option>Top 3</option><option selected>Normal</option><option>Low</option></select><input id="td" type="date" aria-label="Due date"><button class="p" id="ta">Add</button></div>
  ${list([...S.tasks].sort((x,y)=>(x.done-y.done)||["Top 3","Normal","Low"].indexOf(x.pr)-["Top 3","Normal","Low"].indexOf(y.pr)),t=>`<input type="checkbox" ${t.done?"checked":""} data-tk="${t.id}" aria-label="Done"><span class="grow t">${esc(t.t)} <span class="mu">${t.pr==="Top 3"?"★ ":""}${t.due||""}</span></span>`,"tasks")}</div>
  <div class="card"><h2>Evening reflection</h2>${["What did I accomplish?","Did I hurt or disappoint anyone?","What am I grateful for?","What should I improve tomorrow?"].map((q,i)=>`<label class="mu">${q}</label><input class="rf" data-i="${i}" style="width:100%;margin:4px 0 10px" value="${esc(d.reflect[i]||"")}">`).join("")}</div>`;
 }
 if(tab==="goals"){
  b=`<div class="card"><div class="row"><input id="gt" class="grow" placeholder="A goal, e.g. Memorise Surah Al-Mulk" aria-label="Goal"><select id="ga" aria-label="Area">${AREAS.map(x=>`<option>${x}</option>`)}</select><select id="gh" aria-label="Horizon"><option>Month</option><option>Year</option><option>5 years</option></select><button class="p" id="gb">Add</button></div></div>
  ${AREAS.map(ar=>{const g=S.goals.filter(x=>x.a===ar);if(!g.length)return"";return`<div class="card"><h2>${ar}</h2>${g.map(x=>`<div class="item"><div class="grow"><div>${esc(x.t)} <span class="mu">${x.h}</span></div><div class="bar" aria-hidden="true"><i style="width:${x.p}%"></i></div></div><input type="range" min="0" max="100" step="10" value="${x.p}" data-gp="${x.id}" aria-label="Progress"><button class="x" aria-label="Delete" data-del="goals:${x.id}">✕</button></div>`).join("")}</div>`}).join("")||'<p class="mu">No goals yet. Pick one area to start with.</p>'}`;
 }
 if(tab==="money"){
  const m=new Date().toISOString().slice(0,7),mm=S.money.filter(x=>x.d.startsWith(m)),sum=k=>mm.filter(x=>x.k===k).reduce((s,x)=>s+x.v,0),inc=sum("Earn"),sp=sum("Spend"),sv=sum("Save"),sh=sum("Share");
  b=`<div class="grid">${[["Earned",inc],["Spent",sp],["Saved",sv],["Shared",sh]].map(([l,v])=>`<div class="card"><div class="mu">${l} this month</div><div class="big">${v.toLocaleString()}</div></div>`).join("")}</div>
  <div class="card"><div class="mu">Giving: ${inc?Math.round(sh/inc*100):0}% of income · Saving: ${inc?Math.round(sv/inc*100):0}%</div></div>
  <div class="card"><div class="row"><select id="mk" aria-label="Type"><option>Earn</option><option>Spend</option><option>Save</option><option>Share</option></select><input id="mv" type="number" min="0" placeholder="Amount" aria-label="Amount"><input id="mn" class="grow" placeholder="Note / category" aria-label="Note"><button class="p" id="mb">Add</button></div>
  ${list([...S.money].reverse(),x=>`<span class="grow t">${x.k} · ${x.v.toLocaleString()} <span class="mu">${esc(x.n)} ${x.d}</span></span>`,"money")}</div>
  <p class="mu">Zakat: track your Share entries here; consult a qualified scholar for your nisab and rulings.</p>`;
 }
 if(tab==="people"){
  b=`<div class="card"><div class="row"><select id="pr" aria-label="Relation (required)"><option value="">Relation (required)</option>${["Mother","Father","Spouse","Son","Daughter","Brother","Sister","Grandparent","Relative","Friend","Neighbour","Teacher / Mentor","Colleague","Other"].map(r=>`<option>${r}</option>`).join("")}</select><input id="pn" class="grow" placeholder="Name" aria-label="Name"><input id="pe" type="number" min="1" value="14" style="width:90px" aria-label="Days between contact"><span class="mu">days</span><button class="p" id="pb">Add</button></div>
  ${list(S.people,p=>{const dd=p.last?Math.floor((Date.now()-p.last)/864e5):null;return`<span class="grow t">${esc(p.name)} <b class="mu">${esc(p.rel||"Relation not set")}</b> <span class="mu">${dd===null?"not contacted yet":dd+" days ago"} · every ${p.every}d</span></span><button data-pc="${p.id}">Contacted</button>`},"people")}</div>`;
 }
 if(tab==="library"){
  b=`<div class="card"><div class="row"><select id="nk" aria-label="Type"><option>Thought</option><option>Journal</option><option>Book idea</option><option>Chapter</option><option>Reading</option><option>Reflection</option></select><input id="nt" class="grow" placeholder="Title" aria-label="Title"></div><br><textarea id="nb" placeholder="Write here…" aria-label="Text"></textarea><br><br><button class="p" id="nbtn">Save</button></div>
  <div class="card"><div class="row"><input id="nq" class="grow" placeholder="Search, then press Enter" aria-label="Search" value="${esc(NQ.q)}"><select id="nf" aria-label="Filter"><option value="">All types</option>${["Thought","Journal","Book idea","Chapter","Reading","Reflection"].map(k=>`<option ${NQ.k===k?"selected":""}>${k}</option>`).join("")}</select></div>${list(NF().slice(0,NL),n=>`<div class="grow t">${n.t?`<b>${esc(n.t)}</b> `:""}<span class="mu">${n.k} · ${n.d} · ${n.b.trim().split(/\s+/).filter(Boolean).length} words</span><div style="white-space:pre-wrap">${EX[n.id]||n.b.length<=120?esc(n.b):esc(n.b.slice(0,120))+"…"}</div>${n.b.length>120?`<button class="x" data-ex="${n.id}" style="padding:2px 0;color:var(--em)">${EX[n.id]?"See less":"See more"}</button>`:""}</div>`,"notes")}<p class="mu">Showing ${Math.min(NL,NF().length)} of ${NF().length}</p>${NF().length>NL?`<button id="more">See more entries</button>`:""}</div>
  <div class="card"><h2>Import thoughts</h2><p class="mu">Paste text here. A blank line starts a new entry.</p><textarea id="im" aria-label="Text to import"></textarea><div class="row"><select id="ik" aria-label="Type"><option>Thought</option><option>Journal</option><option>Reflection</option></select><button class="p" id="ib">Import</button></div></div><div class="row"><button id="ex">Export all data</button></div>`;
 }
 if(tab==="remind"){
  b=`<div class="card"><p class="mu">Reminders fire while this page is open. Allow notifications to see them.</p><div class="row"><input id="rt" class="grow" placeholder="Reminder" aria-label="Reminder"><input id="rh" type="time" value="07:00" aria-label="Time"><button class="p" id="rb">Add</button></div>
  ${list(S.rem,r=>`<span class="grow t">${r.h} · ${esc(r.t)}</span>`,"rem")}</div><button id="np">Enable notifications</button>`;
 }
 a.innerHTML=head+b;bind();
}
function bind(){
 const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
 on("#th",()=>{const r=document.documentElement,c=r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");r.dataset.theme=c==="dark"?"light":"dark"});
 document.querySelectorAll("[data-p]").forEach(e=>e.onclick=()=>{const p=day().prayers;p[e.dataset.p]=!p[e.dataset.p];save();render()});
 document.querySelectorAll("[data-tk]").forEach(e=>e.onchange=()=>{const t=S.tasks.find(x=>x.id===e.dataset.tk);t.done=e.checked;save();render()});
 document.querySelectorAll("[data-gp]").forEach(e=>e.onchange=()=>{S.goals.find(x=>x.id===e.dataset.gp).p=+e.value;save();render()});
 document.querySelectorAll("[data-pc]").forEach(e=>e.onclick=()=>{S.people.find(x=>x.id===e.dataset.pc).last=Date.now();save();render()});
 document.querySelectorAll(".rf").forEach(e=>e.oninput=()=>{day().reflect[e.dataset.i]=e.value;save()});
 document.querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>{const[k,id]=e.dataset.del.split(":");S[k]=S[k].filter(x=>x.id!==id);save();render()});
 on("#ta",()=>{const v=$("#tt").value.trim();if(!v)return;S.tasks.push({id:uid(),t:v,pr:$("#tp").value,due:$("#td").value});save();render()});
 on("#gb",()=>{const v=$("#gt").value.trim();if(!v)return;S.goals.push({id:uid(),t:v,a:$("#ga").value,h:$("#gh").value,p:0});save();render()});
 on("#mb",()=>{const v=+$("#mv").value;if(!v)return;S.money.push({id:uid(),k:$("#mk").value,v,n:$("#mn").value,d:today()});save();render()});
 on("#pb",()=>{const v=$("#pn").value.trim(),rl=$("#pr").value;if(!rl){$("#pr").focus();return}if(!v){$("#pn").focus();return}S.people.push({id:uid(),name:v,rel:rl,every:+$("#pe").value||14});save();render()});
 on("#nbtn",()=>{const b=$("#nb").value;if(!b.trim())return;S.notes.push({id:uid(),k:$("#nk").value,t:$("#nt").value,b,d:today()});save();render()});
 on("#rb",()=>{const v=$("#rt").value.trim();if(!v)return;S.rem.push({id:uid(),t:v,h:$("#rh").value});save();render()});
 on("#np",()=>{try{Notification.requestPermission()}catch(e){}});
 on("#ib",()=>{const ps=$("#im").value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);if(!ps.length)return;ps.forEach(p=>S.notes.push({id:uid(),k:$("#ik").value,t:"",b:p,d:today()}));save();render()});
 const nf=$("#nf");if(nf)nf.onchange=()=>{NQ.k=nf.value;NL=10;render()};on("#more",()=>{NL+=10;render()});document.querySelectorAll("[data-ex]").forEach(e=>e.onclick=()=>{EX[e.dataset.ex]=!EX[e.dataset.ex];render()});const nq=$("#nq");if(nq)nq.onchange=()=>{NQ.q=nq.value;render()};
 on("#ex",()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));const l=document.createElement("a");l.href=u;l.download="human-os.json";l.click()});
}
let fired={};
setInterval(()=>{const n=new Date(),h=n.toTimeString().slice(0,5);S.rem.forEach(r=>{const k=r.id+today()+h;if(r.h===h&&!fired[k]){fired[k]=1;try{if(Notification.permission==="granted")new Notification("Human OS",{body:r.t});else alert(r.t)}catch(e){}}})},20000);
render();
</script></body></html>
